#valid

# Map from places to SMT formulas
omega:
  "main.l0" : true
  "main.l1" : (= x 1)
  "main.l2" : (and (= x 1) (= y 1))
  "t1.l1"   : (= z1 1)
  "t1.l2"   : (= z1 2)
  "t1.l3"   : (= z1 4)
  "t1.e"    : false
  "t2.l1"   : (= z2 1)
  "t2.l2"   : (= z2 2)
  "t2.l3"   : (= z2 4)
  "t2.e"    : false

# List of entries specifying name, sort and initial value.
ghost_variables: []
  # not needed in this case

# Map from statements to ghost updates for transitions labeled by the statement
# (presumes that for each statement, there is only one such transition)
#
# Each ghost update is a map from ghost variable names to SMT expressions.
# The SMT expressions may use ghost variables, which always refer to the value
# before the ghost update.
ghost_updates:
  # not needed in this case

