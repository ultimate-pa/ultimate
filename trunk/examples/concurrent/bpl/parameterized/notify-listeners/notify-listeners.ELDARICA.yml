format_version: '2.0'

input_files: 'notify-listeners.bpl'

properties:
  - property_file: ../../../svcomp/properties/unreach-call.prp
    expected_verdict: true

options:
  language: Boogie
  de.uni_freiburg.informatik.ultimate.plugins.icfgtochc:
    # Settings for the program
    Assume program has a precondition: false
    Specification mode: ASSERT_VIOLATIONS
    Single-instance threads: notifier

    # Thread modularity level
    Thread-Modular Proof Level: 1

    # Settings for reduction
    Preference order used for reduction: LOCKSTEP
    Use semi-commutativity: true

  # Fix the best solver for this benchmark
  de.uni_freiburg.informatik.ultimate.plugins.chcsolver:
    CHC solver backend: ELDARICA

