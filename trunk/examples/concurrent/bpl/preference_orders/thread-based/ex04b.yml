format_version: '2.0'

# The file containing the program to verify.
input_files: 'ex04b.bpl'

properties:
  # The property that should be satisfied (unreach-call is a stand-in for "no asserts violated")
  # and the expected verdict (true for correct programs, false for incorrect programs).
  - property_file: ./unreach-call.prp
    expected_verdict: true

options:
  # The language in which the program is written.
  language: BPL
  timeout: 60

  # Ultimate options.
  de.uni_freiburg.informatik.ultimate.plugins.generator.traceabstraction:
    # The preference order that GemCutter should use.
    Complex preference order for POR:
      operator: sequential
      left:
        builtin: checkpoint
        checkpoints:
          - "[89] L28-->$Ultimate##0:"
          - "[68] $Ultimate##0-->L42-1:"
          - "[74] $Ultimate##0-->L54-1:"
          - "[80] $Ultimate##0-->L66-1:"
      right:
        operator: sequential
        # The first preference order (used initially)
        left:
          operator: product
          left:
            builtin: loop_lockstep
            iterations:
              - [thread1Thread1of1ForFork2, 1]
              - [thread3Thread1of1ForFork1, 2]
          right:
            builtin: fixed_order
            partial_order:
              thread3Thread1of1ForFork1: 0
              thread1Thread1of1ForFork2: 0
              thread2Thread1of1ForFork0: 1
        # The second preference order (used later)
        right:
          builtin: loop_lockstep
          iterations:
            - [thread2Thread1of1ForFork0, 1]
            - [thread3Thread1of1ForFork1, 1]
        # Change order when the first loop is done
        switch_on:
          - "[69] L42-1-->thread1FINAL:"
      # Go into lockstep order once all checkpoints are done
      switch_on:
        - "[80] $Ultimate##0-->L66-1:"

    Read initial proof assertions from file if available: true
    Limit iterations: 1

