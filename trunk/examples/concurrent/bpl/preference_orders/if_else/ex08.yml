format_version: '2.0'

# The file containing the program to verify.
input_files: 'ex08.bpl'

properties:
  # The property that should be satisfied (unreach-call is a stand-in for "no asserts violated")
  # and the expected verdict (true for correct programs, false for incorrect programs).
  - property_file: ./unreach-call.prp
    expected_verdict: true

options:
  # The language in which the program is written.
  language: BPL

  # Ultimate options.
  de.uni_freiburg.informatik.ultimate.plugins.generator.traceabstraction:
    # The preference order that GemCutter should use.
    Complex preference order for POR:
      operator: sequential
      left:
        builtin: loop_lockstep
        iterations:
          # Prefer ULTIMATE.start as long as possible, i.e., until both threads have forked
          # Then prefer thread2, until (see switch_on) it has initialized its loop counter.
          - [ULTIMATE.start, 1]
          - [thread2Thread1of1ForFork1, 1]
          - [thread1Thread1of1ForFork0, 1]
      right:
        operator: sequential
        left:
          builtin: loop_lockstep
          iterations:
            # Prefer thread1 until (see switch_on) it has made the if/else decision (after initializing its loop counter)
            - [thread1Thread1of1ForFork0, 1]
            - [ULTIMATE.start, 1]
            - [thread2Thread1of1ForFork1, 1]
        right:
          operator: ifelse
          # The first preference order (used in the if case)
          left:
            builtin: loop_lockstep
            iterations:
              - [thread1Thread1of1ForFork0, 1]
              - [thread2Thread1of1ForFork1, 2]
            # The second preference order (used in the else case)
          right:
            builtin: loop_lockstep
            iterations:
              - [thread1Thread1of1ForFork0, 1]
              - [thread2Thread1of1ForFork1, 1]
          # The letters at which we switch to the if branch
          # To find out the names, set a breakpoint and run Ultimate in debug mode.
          switch_on:
            - "[75] L32-->L34:"

        # Letters for the sequential operator, this should
        # be the letter for entering the if branch and the one
        # for entering the else branch.
        switch_on:
          - "[75] L32-->L34:"
          - "[76] L32-->L46:"
      switch_on:
        - "[89] $Ultimate##0-->L59-1"

    Read initial proof assertions from file if available: true
    Limit iterations: 1

