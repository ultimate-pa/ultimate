<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="{{ 'site.webmanifest' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ 'icon.png' | relative_url }}">

  <link rel="shortcut icon" type="image/x-icon" href="{{ 'favicon.ico' | relative_url }}">

  <link rel="stylesheet" href="{{ 'css/normalize.css' | relative_url }}">
  <link rel="stylesheet" href="{{ 'css/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ 'css/open-iconic-bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ 'css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ 'css/editor.css' | relative_url }}">

  <meta name="theme-color" content="#fafafa">
  <meta name="description" content="">
  <title>Uni-Freiburg : SWT - Ultimate</title>

  <script type="text/javascript" charset="utf-8" src="{{ 'js/vendor/jquery-3.4.1.min.js' | relative_url }}"></script>
  <script type="text/javascript" charset="utf-8" src="{{ 'js/vendor/modernizr-3.7.1.min.js' | relative_url }}"></script>
  <script type="text/javascript" charset="utf-8" src="{{ 'js/vendor/bootstrap.bundle.min.js' | relative_url }}"></script>
  <script type="text/javascript" charset="utf-8" src="{{ 'js/plugins.js' | relative_url }}"></script>
  {% for file in page.js %}
  <script type="text/javascript" charset="utf-8" src="{{ 'js/' | append: file | relative_url }}"></script>
  {% endfor %}
</head>

<body>
<div class="d-flex h-100 flex-column">
  <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">

    <div class="flex-column w-100">
      <!-- Logo with name and page title -->
      <div class="d-flex align-items-center">
        <a id="brand_title" class="navbar-brand d-flex align-items-center" href="{{ '/' | relative_url }}">
          <img src="{{ 'img/ultimate_logo.png' | relative_url }}" class="brand-logo d-inline-block align-top" alt="">

          <span style="font-variant:small-caps; font-size: 1.5rem;">Ultimate</span>

          {% if page.title and page.title != "" %}
          <span id="brand_divider" class="border-start border-secondary mx-2" style="height: 1.5rem;"></span>
          <span id="brand_title_text" style="font-size: 1.5rem;">{{ page.title }}</span>
          {% else %}
          <span id="brand_divider" class="border-start border-secondary mx-2 d-none" style="height: 1.5rem;"></span>
          <span id="brand_title_text" style="font-size: 1.5rem;"></span>
          {% endif %}
        </a>

        <!-- Collapsable menu button -->
        <div class="ms-auto d-flex h-100">
          <div class="d-flex align-items-center">
            <a href="https://github.com/ultimate-pa/ultimate" target="_blank" class="text-dark">
              <svg width="24" height="24" viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z" fill="#24292f" />
              </svg>
            </a>

            <button id="navbar_toggler" class="navbar-toggler ms-4 d-none" type="button" data-toggle="collapse" data-target="#navbar_content" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Webinterface controls -->
      <div class="collapse navbar-collapse w-100" id="navbar_content">
        <!-- controls injected here -->
      </div>
    </div>
  </nav>

  <div id="content" class="d-flex flex-column flex-grow-1 p-5">
    {{ content }}
  </div>

  <footer class="d-flex bg-light py-2 px-2 border-top small text-muted">
    <span id="version_info_text"></span>
    <div class="ms-auto d-flex gap-4">
      <a href="{{ 'privacy-policy/' | relative_url }}">Privacy</a>
      <a href="{{ 'imprint/' | relative_url }}">Imprint</a>
    </div>
  </footer>
</div>
</body>

</html>
